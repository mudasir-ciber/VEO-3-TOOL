<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chained Evolution Studio</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">⚡ VEO 3 STUDIO</div>
    <div class="subtitle">Chained Evolution Studio</div>
  </div>

  <div class="action-box">
    <button id="btnOpenStudio" class="btn-primary-large">
      <span class="btn-icon">🚀</span>
      <span>OPEN STUDIO DASHBOARD</span>
    </button>
    <div class="action-subgroup">
      <button id="btnOpenSidePanel" class="btn-secondary-sm">📋 Open as Side Panel</button>
      <button id="btnOpenFlow" class="btn-secondary-sm">🌐 Open Google Flow</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Flow Tab:</span>
      <span class="val" id="flowStatus">CHECKING...</span>
    </div>

    <div class="row">
      <span class="label">Project:</span>
      <span class="val" id="projectStatus">--</span>
    </div>

    <div class="row">
      <span class="label">Flow Tab ID:</span>
      <span class="val" id="tabId">None</span>
    </div>

    <div class="row">
      <span class="label">Profile:</span>
      <span class="val bold" id="profileName">Default</span>
    </div>
  </div>

  <div class="footer">
    <button id="btnRefresh" class="btn-link">🔄 Refresh Connection</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
