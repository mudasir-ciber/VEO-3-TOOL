<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VEO 3 Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">⚡ VEO 3 BRIDGE</div>
    <div class="subtitle">Chained Evolution Studio</div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Profile:</span>
      <div class="profile-input-group">
        <input type="text" id="profileName" placeholder="e.g. YOUTUBE, MUZAMIL" spellcheck="false" />
        <button id="btnSaveProfile" title="Save profile name">Save</button>
      </div>
    </div>

    <div class="row">
      <span class="label">Extension ID:</span>
      <span class="val" id="instanceId">--</span>
    </div>

    <div class="divider"></div>

    <div class="row">
      <span class="label">Extension:</span>
      <span class="val green" id="extStatus">CONNECTED ✓</span>
    </div>

    <div class="row">
      <span class="label">Desktop App:</span>
      <span class="val" id="appStatus">CHECKING...</span>
    </div>

    <div class="row">
      <span class="label">Flow Tab:</span>
      <span class="val" id="flowStatus">NOT DETECTED</span>
    </div>

    <div class="row">
      <span class="label">Project:</span>
      <span class="val" id="projectStatus">--</span>
    </div>

    <div class="row">
      <span class="label">Flow Tab ID:</span>
      <span class="val" id="tabId">None</span>
    </div>

    <div class="row">
      <span class="label">Status:</span>
      <span class="val bold" id="operationalStatus">IDLE</span>
    </div>
  </div>

  <div class="footer">
    <button id="btnRefresh">🔄 Refresh Flow Status</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
