<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      background-color: #0b0f19;
      color: #f1f5f9;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background-color: #2563eb;
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .status-box {
      background-color: #141a29;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10b981;
      margin-right: 6px;
    }
    label {
      font-size: 11px;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background-color: #1e2638;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #ffffff;
      padding: 6px 8px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    button {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .note {
      font-size: 10px;
      color: #64748b;
      margin-top: 8px;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <h3>Chained Evolution <span class="badge">Bridge</span></h3>
  
  <div class="status-box">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Checking Studio connection...</span>
  </div>

  <label for="profileInput">Active Chrome Profile Name:</label>
  <input type="text" id="profileInput" placeholder="e.g. YOUTUBE, John, Muzamil">

  <button id="saveBtn">Save Profile Name</button>

  <div class="note">
    This extension connects your open Chrome session with Chained Evolution Studio to control Google Flow.
  </div>

  <script src="popup.js"></script>
</body>
</html>
